<div id="whisper-all-states" aria-label="Inline whisper flow study">
<div class="state-previews viz-dotted-background" aria-label="All proposed whisper states shown together">
<section data-variant="Reading"><h3>Reading — nothing selected</h3><div class="wf" aria-label="Reading without a selection"></div></section>
<section data-variant="Pending selection"><h3>Text selected — not labeled yet</h3><div class="wf" aria-label="New pending selection"></div></section>
<section data-variant="Label assigned"><h3>Label assigned — the actual name is confirmed</h3><div class="wf" aria-label="Assigned label with explicit checkmark"></div></section>
<section data-variant="Precise keyboard selection"><h3>Precise keyboard selection</h3><div class="wf" aria-label="Precise keyboard selection"></div></section>
<section data-variant="Editing saved annotation"><h3>Editing an existing annotation</h3><div class="wf" aria-label="Editing an existing saved annotation"></div></section>
<section data-variant="After undo"><h3>After Undo — selection cleared</h3><div class="wf" aria-label="After an annotation was undone"></div></section>
<section data-variant="Toolbar expanded"><h3>Toolbar swap — selection preserved</h3><div class="wf" aria-label="Pending selection with the action toolbar swapped in"></div></section>
<section data-variant="Multiline and long labels"><h3>Narrow layout — multiline selection and long labels</h3><div class="wf narrow" aria-label="Multiline and long label layout tradeoff"></div></section>
</div>
</div>
<style>
#whisper-all-states{color-scheme:light dark}
#whisper-all-states .state-previews>section{padding:20px 8px 32px;box-sizing:border-box}
#whisper-all-states .state-previews>section>h3{max-width:700px;margin:0 auto 12px}
#whisper-all-states .wf{--wf-paper:light-dark(#fff,#222);--wf-ink:light-dark(#252525,#eee);--wf-muted:light-dark(#626262,#bcbcbc);--wf-line:light-dark(#d5d5d5,#575757);--wf-soft:light-dark(#f3f3f3,#303030);--wf-selection:light-dark(#e5e5e5,#454545);background:var(--wf-paper);color:var(--wf-ink);border:1px solid var(--wf-line);border-radius:5px;font:14px/1.65 system-ui,sans-serif;max-width:700px;margin:auto;overflow-wrap:anywhere}
#whisper-all-states .wf *{box-sizing:border-box}
#whisper-all-states .wf button{background:transparent;color:var(--wf-ink);font:inherit;border:0;border-radius:3px;padding:7px 9px;min-height:36px}
#whisper-all-states .wf button:disabled{opacity:.4}
#whisper-all-states .wf header{border-bottom:1px solid var(--wf-line)}
#whisper-all-states .wf .navline{display:flex;gap:8px;align-items:center;padding:9px 18px;flex-wrap:nowrap;height:62px}
#whisper-all-states .wf .filename{font-size:12px;color:var(--wf-muted);flex:1;min-width:0}
#whisper-all-states .wf .toggle{flex:none}
#whisper-all-states .wf .done{border:1px solid var(--wf-line);font-size:12px}
#whisper-all-states .wf .commands{display:flex;gap:4px;flex-wrap:nowrap;align-items:center;flex:1;min-width:0;overflow-x:auto;scrollbar-width:thin}
#whisper-all-states .wf .commands button{font-size:12px;flex:none;white-space:nowrap}
#whisper-all-states .wf .commands [data-action="help"]{display:none}
#whisper-all-states .wf .commands .label-command{border:1px solid var(--wf-line)}
#whisper-all-states .wf .help{font-size:12px;color:var(--wf-muted);margin:0;padding:12px 18px;border-top:1px solid var(--wf-line);background:var(--wf-soft)}
#whisper-all-states .wf article{padding:30px 38px 22px}
#whisper-all-states .wf .eyebrow{font-size:12px;color:var(--wf-muted);letter-spacing:.05em}
#whisper-all-states .wf h2{font:500 25px/1.3 system-ui;margin:9px 0 23px}
#whisper-all-states .wf p{margin:0 0 22px}
#whisper-all-states .wf .passage{display:inline;font:inherit;text-align:left;padding:1px 0;min-height:0;border-radius:0;box-decoration-break:clone;-webkit-box-decoration-break:clone}
#whisper-all-states .wf .passage.pending{background:var(--wf-selection);border-bottom:1px solid var(--wf-ink)}
#whisper-all-states .wf .passage.committed{background:var(--wf-soft);border-bottom:2px solid var(--wf-ink)}
#whisper-all-states .wf .passage.editing{outline:1px solid var(--wf-line);outline-offset:3px}
#whisper-all-states .wf .whisper{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:8px;font:12px/1.65 system-ui;color:var(--wf-muted);margin:-11px 0 24px;min-height:24px}
#whisper-all-states .wf .whisper-status{font-weight:400;text-align:center;white-space:nowrap}
#whisper-all-states .wf .end{min-width:0;overflow-wrap:anywhere}
#whisper-all-states .wf .end:last-child{text-align:right}
#whisper-all-states .wf .active{font-weight:500;text-decoration:underline;text-underline-offset:4px;color:var(--wf-ink)}
#whisper-all-states .wf .code{white-space:pre-wrap;padding:12px;background:var(--wf-soft);font:12px/1.7 ui-monospace,monospace;margin:0 0 22px}
#whisper-all-states .wf .note{font-size:12px;color:var(--wf-muted)}
#whisper-all-states .wf .keyboard-button{display:inline-flex;align-items:center;justify-content:center}
#whisper-all-states .wf .keys-dialog{position:absolute;left:0;right:0;bottom:auto;margin:0 auto;background:var(--wf-paper);color:var(--wf-ink);border:1px solid var(--wf-line);border-radius:7px;padding:20px;width:min(470px,calc(100% - 28px));max-height:calc(100% - 28px);overflow:auto;font:13px/1.5 system-ui,sans-serif}
#whisper-all-states .wf .keys-dialog::backdrop{background:light-dark(#0005,#0009)}
#whisper-all-states .wf .keys-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
#whisper-all-states .wf .keys-heading h3{font:500 17px/1.4 system-ui;margin:0}
#whisper-all-states .wf .key-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;padding:7px 0;border-bottom:1px solid var(--wf-line)}
#whisper-all-states .wf .key-combo{display:flex;gap:4px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
#whisper-all-states .wf kbd{font:12px/1.5 ui-monospace,monospace;display:inline-block;min-width:23px;text-align:center;padding:2px 5px;border:1px solid var(--wf-line);border-bottom-width:2px;border-radius:4px;background:var(--wf-soft)}
#whisper-all-states .wf .keys-note{font-size:12px;color:var(--wf-muted);margin:12px 0 0}
#whisper-all-states .wf .keys-dialog details{margin-top:14px}
#whisper-all-states .wf [hidden]{display:none!important}
#whisper-all-states .wf.narrow{max-width:350px}
#whisper-all-states .wf.narrow article{padding:25px 20px}
#whisper-all-states .wf.narrow .whisper{align-items:start}
@media(max-width:500px){#whisper-all-states .wf article{padding:25px 20px}}
@media(pointer:coarse){#whisper-all-states .wf button{min-height:44px}}
</style>
<script>
(()=>{
const root=document.getElementById('whisper-all-states');
const mac=/Mac|iPhone|iPad/.test(navigator.platform);
const shortcut=mac?'Option':'Alt';const undoKey=mac?'Cmd+Z':'Ctrl+Z';
const presets={Application:{a:'Accept',b:'Reject'},Research:{a:'Evidence',b:'Question'},Long:{a:'Needs source verification',b:'Ready for publication'}};
const saved=window.openai?.widgetState?.privateContent?.whisperAllStatesKeyboard;
const scenes=['Reading','Pending','Precise selection','Just labeled','Editing saved','After undo','Toolbar open'];
const views={};
function persist(){window.openai?.setWidgetState?.({modelContent:{design:'Toolbar swap and state-led whisper'},privateContent:{whisperAllStatesKeyboard:Object.fromEntries(Object.entries(views).map(([name,v])=>[name,v.capture()]))}})?.catch(()=>{});}
function createPreview(initial){
 let data=structuredClone(initial),past=[],future=[];
 return {
  read:()=>data,
  replace(next){data=structuredClone(next);past=[];future=[];},
  change(next){past.push(structuredClone(data.labels));future=[];data.labels=next;data.pending=null;data.active=null;data.precise=false;},
  undo(){if(!past.length)return false;future.push(structuredClone(data.labels));data.labels=past.pop();data.pending=null;data.active=null;data.precise=false;return true;},
  redo(){if(!future.length)return false;past.push(structuredClone(data.labels));data.labels=future.pop();data.pending=null;data.active=null;data.precise=false;return true;},
  canUndo:()=>past.length>0,canRedo:()=>future.length>0,
  snapshot:()=>structuredClone({data,past,future}),
  restore(snapshot){data=structuredClone(snapshot.data);past=structuredClone(snapshot.past);future=structuredClone(snapshot.future);}
 };
}
root.querySelectorAll('.wf').forEach((el,index)=>{
 const name=el.parentElement.dataset.variant;
 const prior=saved?.[name];
 const initialScenes={'Pending selection':'Pending','Reading':'Reading','Label assigned':'Just labeled','Precise keyboard selection':'Precise selection','Editing saved annotation':'Editing saved','After undo':'After undo','Toolbar expanded':'Toolbar open','Multiline and long labels':'Pending'};
 const isStress=name==='Multiline and long labels';
 const options={scene:scenes.includes(prior?.scene)?prior.scene:initialScenes[name],labels:Object.hasOwn(presets,prior?.labels)?prior.labels:isStress?'Long':'Application',narrow:prior?.narrow??isStress};
 let renderedScene=options.scene;
 const session=createPreview({labels:{},pending:null,active:null,precise:false});
 let expanded=false,receipt=null,notice='',anchor='one';
 el.innerHTML=`<header><div class="navline"><span class="filename">project-notes.md</span><div class="commands" id="wf-controls-${index}" hidden><button type="button" class="label-command cursor-interaction" data-assign="a"></button><button type="button" class="label-command cursor-interaction" data-assign="b"></button><button type="button" class="cursor-interaction" data-action="undo">Undo</button><button type="button" class="cursor-interaction" data-action="redo">Redo</button><button type="button" class="cursor-interaction" data-action="clear">Clear</button><button type="button" class="cursor-interaction" data-action="annotations">Annotations</button><button type="button" class="cursor-interaction" data-action="help">Help</button></div><button type="button" class="toggle cursor-interaction" aria-label="Expand or collapse review controls" aria-controls="wf-controls-${index}" aria-expanded="false">•••</button><button type="button" class="done cursor-interaction">Done</button></div><p class="help" hidden></p></header><article><div class="eyebrow">PROJECT NOTES / 03</div><h2>A reliable review flow</h2><p>The reader should always know what is selected and what has been labeled.</p><p data-paragraph="one"><button type="button" class="passage cursor-interaction" data-passage="one">Keep local work available when saving fails. A failed export must leave the review open for retry.</button></p><div class="whisper"><span class="end" data-end="a"></span><span class="whisper-status"></span><span class="end" data-end="b"></span></div><p data-paragraph="two"><button type="button" class="passage cursor-interaction" data-passage="two">Give every annotation a stable identity, including passages that overlap.</button></p><pre class="code"><code>review.restore(savedAnnotations)</code></pre><p class="note">Every annotation remains independently editable.</p></article>`;
 const toggle=el.querySelector('.toggle'),panel=el.querySelector('.commands'),help=el.querySelector('.help'),whisper=el.querySelector('.whisper');
 const keyboard=document.createElement('button');keyboard.type='button';keyboard.className='keyboard-button cursor-interaction';keyboard.setAttribute('aria-label','Keyboard shortcuts');keyboard.setAttribute('aria-haspopup','dialog');keyboard.innerHTML='<i data-lucide="keyboard" aria-hidden="true"></i>';toggle.before(keyboard);
 const dialog=document.createElement('dialog');dialog.className='keys-dialog';dialog.setAttribute('aria-labelledby',`wf-keys-title-${index}`);el.append(dialog);
 const command=mac?'⌘':'Ctrl';const option=mac?'⌥':'Alt';
 const caps=keys=>keys.map(key=>`<kbd>${key}</kbd>`).join('');
 const row=(label,keys)=>{const div=document.createElement('div');div.className='key-row';const text=document.createElement('span');text.textContent=label;const combo=document.createElement('span');combo.className='key-combo';combo.innerHTML=caps(keys);div.append(text,combo);return div;};
 function openShortcuts(){
  const labels=presets[options.labels];
  dialog.innerHTML=`<div class="keys-heading"><h3 id="wf-keys-title-${index}">Keyboard shortcuts</h3><button type="button" class="cursor-interaction" aria-label="Close keyboard shortcuts"><i data-lucide="x" aria-hidden="true"></i></button></div>`;
  [[`Label ${labels.a}`,[option,'←']],[`Label ${labels.b}`,[option,'→']],['Cancel / close',['Esc']],['Undo annotation',[command,'Z']],['Redo annotation',[command,'⇧','Z']],['Remove active target',[mac?'⌫':'Delete']],['Done & export',[command,'↵']]].forEach(([text,keys])=>dialog.append(row(text,keys)));
  const details=document.createElement('details');const summary=document.createElement('summary');summary.className='cursor-interaction';summary.textContent='Selection & navigation';details.append(summary);
  [['Move between controls',['Tab']],['Previous control',['⇧','Tab']],['Next / previous block',[option,'↓ / ↑']],['Select focused block',['↵']],['Precise selection mode',['F2']],['Extend exact selection',['⇧','← / →']],['Extend selection by word',[mac?'⌥':'Ctrl','⇧','← / →']],['Next / previous annotation',[option,'N / P']],['Choose overlapping annotation',['↑ / ↓','↵']],['Show this popup',['F1']]].forEach(([text,keys])=>details.append(row(text,keys)));dialog.append(details);
  const note=document.createElement('p');note.className='keys-note';note.textContent='Undo reverses the latest annotation change and clears pending text. Precise-selection mode uses arrows to adjust text, rather than assign a label. Escape closes this popup first; your selection stays available.';dialog.append(note);
  dialog.querySelector('[aria-label="Close keyboard shortcuts"]').onclick=()=>dialog.close();
  if(globalThis.lucide)lucide.createIcons({attrs:{width:18,height:18}});
  // This storyboard's iframe spans all seven states; centre-in-iframe would be offscreen.
  dialog.style.top=`${Math.max(12,keyboard.getBoundingClientRect().bottom+10)}px`;
  if(!dialog.open)dialog.showModal();
 }
 keyboard.onclick=openShortcuts;
 dialog.onclose=()=>keyboard.focus();
 const live=el.querySelector('.whisper-status');live.setAttribute('role','status');live.setAttribute('aria-live','polite');
 function announce(message){if(live.textContent!==message)live.textContent=message;}
 function render(){
  const data=session.read(),labels=presets[options.labels],target=data.pending||data.active;
  const marked=data.active||receipt;
  const assigned=marked?data.labels[marked]:null;
  whisper.hidden=!(target||(receipt&&data.labels[receipt]));
  el.classList.toggle('narrow',options.narrow);
  panel.hidden=!expanded;toggle.setAttribute('aria-expanded',String(expanded));el.querySelector('.filename').hidden=expanded;
  el.querySelector('.done').hidden=false;
  toggle.setAttribute('aria-label',expanded?'Restore document navbar':'Swap navbar to review actions');
  el.querySelector(`[data-paragraph="${anchor}"]`).after(whisper);
  el.querySelectorAll('[data-passage]').forEach(button=>{
   const id=button.dataset.passage;button.classList.toggle('pending',data.pending===id);button.classList.toggle('committed',!!data.labels[id]);button.classList.toggle('editing',data.active===id);
   button.setAttribute('aria-label',data.labels[id]?`Edit annotation: ${labels[data.labels[id]]}`:'Select passage');
  });
  let message='';
  const compact=options.narrow||window.matchMedia('(max-width:500px)').matches;
  if(data.precise)message=session.canUndo()?`Selecting · ${undoKey} undo`:'Selecting text';
  else if(data.pending)message=expanded?'Unlabeled · choose above':compact?'Unlabeled':'Unlabeled · scroll over selection ↔';
  else if(data.active)message=compact?`✓ ${labels[assigned]}`:`✓ ${labels[assigned]} · ••• to edit`;
  else if(receipt)message=`✓ ${labels[assigned]} · ${undoKey} undo`;
  announce(message);
  ['a','b'].forEach(id=>{
   const word=(assigned===id?'✓ ':'')+labels[id];
   const end=el.querySelector(`[data-end="${id}"]`);end.textContent=id==='a'?`← ${word}`:`${word} →`;end.classList.toggle('active',assigned===id);
   const button=el.querySelector(`[data-assign="${id}"]`);button.textContent=id==='a'?`← ${labels[id]}`:`${labels[id]} →`;button.disabled=!target||data.precise;
  });
  el.querySelector('[data-action="undo"]').disabled=!session.canUndo();el.querySelector('[data-action="redo"]').disabled=!session.canRedo();el.querySelector('[data-action="clear"]').disabled=!target;
  whisper.setAttribute('aria-label',`${message}. Left label ${labels.a}. Right label ${labels.b}.${assigned?' Assigned '+labels[assigned]+'.':''}`);
 }
 function resetScene(){
  renderedScene=options.scene;
  session.replace({labels:{},pending:null,active:null,precise:false});expanded=false;receipt=null;notice='';anchor='one';help.hidden=true;
  const data=session.read();
  if(['Pending','Precise selection','Toolbar open'].includes(options.scene))data.pending='one';
  if(options.scene==='Precise selection'){session.change({two:'b'});data.pending='one';data.precise=true;}
  if(['Just labeled','Editing saved','After undo'].includes(options.scene)){session.change({one:'a'});if(options.scene==='Just labeled')receipt='one';if(options.scene==='Editing saved')data.active='one';if(options.scene==='After undo'){session.undo();notice='Annotation undone · select text';}}
  expanded=options.scene==='Toolbar open';render();
 }
 function classify(id){const data=session.read();const target=data.pending||data.active;if(!target||data.precise)return;session.change({...data.labels,[target]:id});receipt=target;anchor=target;notice='';help.hidden=true;render();persist();}
 function history(direction){const done=session[direction]();if(!done)return;receipt=null;notice=direction==='undo'?'Annotation undone · select text':'Annotation redone · select text';render();persist();}
 el.querySelectorAll('[data-passage]').forEach(button=>button.onclick=()=>{
  button.focus();const data=session.read(),id=button.dataset.passage;
  data.pending=data.labels[id]?null:id;data.active=data.labels[id]?id:null;data.precise=false;anchor=id;receipt=null;notice='';help.hidden=true;render();persist();
 });
 toggle.onclick=()=>{expanded=!expanded;if(!expanded){help.hidden=true;toggle.focus();}render();persist();};
 el.querySelectorAll('[data-assign]').forEach(b=>b.onclick=()=>classify(b.dataset.assign));
 el.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{
  const data=session.read();
  if(b.dataset.action==='undo')return history('undo');
  if(b.dataset.action==='redo')return history('redo');
  if(b.dataset.action==='clear'){data.pending=null;data.active=null;data.precise=false;receipt=null;notice='';render();persist();return;}
  if(b.dataset.action==='help'){openShortcuts();return;}
  help.hidden=false;
  if(b.dataset.action==='annotations')help.textContent=Object.keys(data.labels).length?Object.entries(data.labels).map(([id,label])=>`Passage ${id}: ${presets[options.labels][label]}`).join(' · '):'No committed annotations.';
  if(b.dataset.action==='help')help.textContent=`Select a passage, then hover its highlight and scroll horizontally to label (proposed behavior). ${shortcut}+Left / Right labels pending text or edits the active annotation. F2 finishes precise selection. ${undoKey} reverses history and clears the target. Open ••• for mouse-accessible controls.`;
 });
 el.querySelector('.done').onclick=()=>{help.hidden=false;help.textContent=session.read().pending?'Label or clear the pending text before finishing.':'Preview only · Done would automatically export the review in the configured format.';render();};
 el.addEventListener('keydown',event=>{
  if(dialog.open)return;
  if(event.key==='F1'){event.preventDefault();openShortcuts();return;}
  const data=session.read();
  if(event.key==='Escape'){event.preventDefault();if(expanded){expanded=false;help.hidden=true;toggle.focus();}else{data.pending=null;data.active=null;data.precise=false;receipt=null;notice='';}render();persist();return;}
  if(event.key==='F2'){event.preventDefault();if(data.pending)data.precise=!data.precise;render();persist();return;}
  if((mac?event.metaKey:event.ctrlKey)&&!event.altKey&&event.key.toLowerCase()==='z'){event.preventDefault();history(event.shiftKey?'redo':'undo');return;}
  if(data.precise)return;
  if(event.altKey&&!event.metaKey&&!event.ctrlKey&&!event.shiftKey&&['ArrowLeft','ArrowRight'].includes(event.key)){if(data.pending||data.active){event.preventDefault();classify(event.key==='ArrowLeft'?'a':'b');}}
 });
 function capture(){return {...options,session:session.snapshot(),expanded,receipt,notice,anchor};}
 function restore(snapshot){
  renderedScene=options.scene;
  if(!snapshot.session){resetScene();return;}
  session.restore(snapshot.session);expanded=!!snapshot.expanded;receipt=['one','two'].includes(snapshot.receipt)?snapshot.receipt:null;notice=typeof snapshot.notice==='string'?snapshot.notice:'';anchor=snapshot.anchor==='two'?'two':'one';render();
 }
 views[name]={options,resetScene,render,capture,restore};resetScene();if(prior?.session)restore(prior);
 if(globalThis.Tweak){const tweak=new Tweak({container:el,onChange:()=>{if(options.scene!==renderedScene)resetScene();else render();persist();}});tweak.addSelect(options,'scene',{label:'Flow state',options:scenes});tweak.addSelect(options,'labels',{label:'Host label values',options:Object.keys(presets)});tweak.addToggle(options,'narrow',{label:'Narrow layout'});}
});
if(globalThis.lucide)lucide.createIcons({attrs:{width:18,height:18}});
window.addEventListener('openai:set_globals',event=>{
 const incoming=event.detail?.globals?.widgetState?.privateContent?.whisperAllStatesKeyboard;if(!incoming)return;
 Object.entries(views).forEach(([name,v])=>{const next=incoming[name];if(!next)return;if(scenes.includes(next.scene))v.options.scene=next.scene;if(Object.hasOwn(presets,next.labels))v.options.labels=next.labels;if(typeof next.narrow==='boolean')v.options.narrow=next.narrow;v.restore(next);});
});
window.addEventListener('resize',()=>Object.values(views).forEach(v=>v.render()));
// These are local storyboard transitions, not native Range/Selection or gesture handling.
const proof=createPreview({labels:{},pending:'one',active:null,precise:false});
proof.change({one:'a'});console.assert(proof.read().pending===null&&proof.read().active===null,'Commit clears targets');
proof.undo();console.assert(proof.read().pending===null&&Object.keys(proof.read().labels).length===0,'Undo does not recreate pending text');
proof.redo();console.assert(proof.read().pending===null&&proof.read().labels.one==='a','Redo restores annotation only');
})();
</script>
